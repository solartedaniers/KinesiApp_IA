[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kinesiapp-ai"
version = "0.2.0"
description = "KinesiApp AI: pose analysis with MediaPipe, risk scoring and the Gemini chat prompt"
requires-python = ">=3.12"
# Mismas versiones que fijaba backend/requirements.txt: mover el código no debe cambiar ningún resultado
dependencies = [
    # opencv-contrib-python es la variante que exige mediapipe; se fija porque el análisis importa cv2 directo
    "mediapipe==1.0.1",
    "opencv-contrib-python==5.0.0.93",
    "numpy==2.5.3",
    "scipy==1.18.1",
    # Corre el detector de personas YOLO (yolo11n.onnx, lo descarga el Dockerfile del backend fijado
    # por checksum). Sin el paquete ultralytics: arrastra torch y descarga/instala cosas al ejecutar
    "onnxruntime==1.30.0",
    "google-genai==2.27.0",
    # chat/gemini_client.py lo importa directo (errores de red/timeout): no depender de que llegue transitivo
    "httpx==0.28.1",
    # Servidor gRPC asíncrono, con las mismas versiones que el backend para hablar igual el protocolo
    "grpcio==1.84.0",
    # Devuelvo google.rpc.Status con ErrorInfo en los errores, como el backend
    "grpcio-status==1.84.0",
    # La salud la expongo con el estándar grpc.health.v1
    "grpcio-health-checking==1.84.0",
    "protobuf==7.36.2",
    "pydantic-settings==2.7.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]
# Solo para generar el código de los contratos (scripts/generate_grpc.py); no va en la imagen final
codegen = ["grpcio-tools==1.84.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Pruebo contra el código fuente sin instalar el paquete, y con el código generado de los contratos
pythonpath = ["src", "generated"]
